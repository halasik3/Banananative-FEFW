# Builds the Banana Native app with Fire Emblem: Fortune's Weave added AND the real on-phone packer ("Prepare" works on the phone, Windows PC not needed).
# Run it from the Actions tab: "Build Fortune's Weave APK (on-phone Prepare)" > Run workflow. The APK is under "Artifacts" on the run's page.
# It needs a Mac machine (GitHub provides one) because the packer's build script is written for macOS. This takes a long time (an hour or more).
name: Build Fortune's Weave APK (on-phone Prepare)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Your repository (BananaNative plus fefw.patch in its top folder)
        uses: actions/checkout@v4
        with:
          path: bn

      - name: Apply the patch
        working-directory: bn
        run: git apply --whitespace=nowarn fefw.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tools and Android SDK pieces
        run: |
          brew install ninja cmake || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the on-phone packer (Python, translator, SPIR-V tools, zbic)
        working-directory: bn
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/work" all

      - name: Use your fixed signing key (so a new APK installs over the old one)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore; echo "using the fixed key"; else echo "no DEBUG_KEYSTORE_B64 secret: this APK gets a new random key"; fi

      - name: Build the APK
        working-directory: bn/android/app
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sh ./gradlew -PnxGames=04007EF01F8AE000 -PnxApp=fefw -PnxPackStage="$RUNNER_TEMP/work/stage" apk --stacktrace

      - name: The APK
        uses: actions/upload-artifact@v4
        with:
          name: banana-native-fortunes-weave-apk-phone-prepare
          path: bn/android/app/out/*.apk
          if-no-files-found: error

      - name: Logs (if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/work/**/*.log
          if-no-files-found: ignore
